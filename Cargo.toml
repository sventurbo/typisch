[package]
name = "typisch"
version = "0.1.0"
edition = "2024"
description = "Typst-Editor mit Live-Vorschau – zuerst für macOS"

# Shown next to the version number (start screen, "Über Typisch", Mac app info).
[package.metadata.typisch]
release-date = "November 2026"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rfd = "0.17"
typst = "0.15.1"
typst-render = "0.15.1"
typst-pdf = "0.15.1"
typst-kit = { version = "0.15.1", features = ["embedded-fonts", "scan-fonts", "system-files", "system-packages", "system-downloader", "datetime"] }
typst-layout = "0.15.1"
typst-assets = { version = "0.15.1", features = ["fonts"] }
# Typst's own autocompletion, the same as in the web app.
typst-ide = "0.15.1"
# Typst's compile cache: evicting it after each compile, as the typst CLI does in
# watch mode, keeps a long session's memory use from slowly growing.
comemo = "0.5.1"
codex = "0.3"
tiny-skia = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"
arboard = { version = "3", default-features = false }
# Zotero reference sync: HTTPS requests with the system's TLS, like typst-kit's package downloads.
ureq = { version = "2.12", default-features = false, features = ["native-tls", "gzip", "json", "proxy-from-env"] }
native-tls = "0.2"
# Finder writes names in decomposed Unicode, typed names are composed: compare both ways.
unicode-normalization = "0.1"

[dev-dependencies]
# Checks that synced .bib files parse the way Typst reads them.
biblatex = "0.12"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

# Native menu bar on macOS (the system bar at the top of the screen).
[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21", default-features = false }
# To open pop-up menus in the window that was clicked (open_popup in menu.rs).
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSResponder", "NSWindow", "NSView", "NSMenu", "NSMenuItem"] }
# The Zotero API key is kept in the Keychain.
security-framework = "3"

# Linux is a secondary target: its window-system support is only pulled in there.
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
arboard = { version = "3", default-features = false, features = ["wayland-data-control"] }
