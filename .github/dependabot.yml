# Weekly pull requests for new crate releases and for the GitHub Actions used in CI.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    groups:
      # These crates only work together in matching versions.
      typst:
        patterns: ["typst", "typst-*"]
      objc2:
        patterns: ["objc2", "objc2-*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
